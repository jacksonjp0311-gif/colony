name: Colony evolve

on:
  schedule:
    - cron: '26 */6 * * *'   # every 6 hours UTC
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Number of evolve cycles'
        required: false
        default: '3'
      offline:
        description: 'Offline (seed only)'
        required: false
        default: 'false'

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Hard benches
        run: |
          python -m pytest tests -q --tb=no || (echo "::error::benches failed" && exit 1)

      - name: Evolve
        run: |
          CYCLES="${{ github.event.inputs.cycles || '3' }}"
          OFFLINE="${{ github.event.inputs.offline || 'false' }}"
          python -m colony.evolve --cycles "$CYCLES" --offline "$OFFLINE" || true

      - name: Slim receipts and status
        run: |
          python -m colony.evolve --status || true

      - name: Commit deltas
        run: |
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          git add society/ data/ control/ || true
          git diff --staged --quiet || git commit -m "evolve: slim deltas [skip ci]"
          git push || true
